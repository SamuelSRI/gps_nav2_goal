gps_nav2_goal_node:
  ros__parameters:
    gps_topic: /gps/fix
    goal_topic: /gps_goal
    debug_goal_topic: /gps_goal/map_pose
    navigate_to_pose_action: /navigate_to_pose

    map_frame: map
    base_frame: base_link

    # first_fix:
    #   The first valid GPS fix is associated with the current map->base_link pose.
    # fixed:
    #   Use the manually configured geographic/map anchor below.
    anchor_mode: first_fix

    anchor_latitude: 0.0
    anchor_longitude: 0.0
    anchor_altitude: 0.0
    anchor_map_x: 0.0
    anchor_map_y: 0.0

    # Counter-clockwise rotation from ENU to the Nav2 map frame.
    # 0 deg means map +X=east and map +Y=north.
    map_yaw_deg: 0.0

    # face_goal or fixed
    goal_orientation_mode: face_goal
    fixed_goal_yaw_deg: 0.0

    use_goal_altitude: false
    minimum_fix_status: 0
    maximum_goal_distance_m: 5000.0
    tf_timeout_sec: 0.2
    action_retry_period_sec: 0.5
